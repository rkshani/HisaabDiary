name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        shell: bash
        run: ./gradlew assembleDebug 2>&1 | tee -a gradle-output.log

      - name: Unit tests
        shell: bash
        run: ./gradlew testDebugUnitTest 2>&1 | tee -a gradle-output.log

      - name: Lint
        shell: bash
        run: ./gradlew lint 2>&1 | tee -a gradle-output.log

      - name: ktlint and detekt
        # Run even when Lint failed, so we see all problems at once.
        if: ${{ !cancelled() }}
        shell: bash
        run: ./gradlew ktlintCheck detekt --continue 2>&1 | tee -a gradle-output.log

      - name: Show lint, ktlint and detekt problems as annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, json, os
          for path in glob.glob("app/build/reports/**/*.sarif", recursive=True):
              data = json.load(open(path))
              for run in data.get("runs", []):
                  for r in run.get("results", []):
                      if r.get("level") == "note" or r.get("ruleId") == "LintBaseline":
                          continue
                      loc = (r.get("locations") or [{}])[0].get("physicalLocation", {})
                      uri = loc.get("artifactLocation", {}).get("uri", "")
                      line = loc.get("region", {}).get("startLine", 1)
                      msg = r.get("message", {}).get("text", "").replace(chr(10), " ")
                      print(f"::error file={uri},line={line}::[{r.get('ruleId')}] {msg}")
          # Kotlin compiler errors and failed tests from the Gradle output.
          if os.path.exists("gradle-output.log"):
              shown = 0
              for row in open("gradle-output.log", errors="replace"):
                  row = row.strip()
                  if row.startswith("e: ") or " FAILED" in row or "Exception" in row:
                      print(f"::error::{row[:900]}")
                      shown += 1
                      if shown >= 40:
                          break
          for path in glob.glob("app/build/reports/ktlint/**/*.txt", recursive=True):
              for row in open(path):
                  if row.strip():
                      print(f"::error::{row.strip()}")
          PY

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports/
          if-no-files-found: ignore
