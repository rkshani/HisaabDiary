# Low-memory settings: this build must run on a PC with limited RAM.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC -Dfile.encoding=UTF-8
# Compile Kotlin inside the Gradle process (no extra Kotlin daemon).
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
