# Only overrides. Everything else uses the detekt defaults (buildUponDefaultConfig = true).
naming:
  FunctionNaming:
    # Composable functions start with a capital letter.
    ignoreAnnotated: [ 'Composable' ]
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

complexity:
  LongMethod:
    # Compose UI functions are long by nature (layout code). Logic lives in ViewModels.
    ignoreAnnotated: [ 'Composable' ]
  LongParameterList:
    # Composables often take many parameters (modifier, state, callbacks).
    ignoreAnnotated: [ 'Composable' ]
    ignoreDefaultParameters: true
    excludes: [ '**/test/**', '**/androidTest/**' ]
  TooManyFunctions:
    # Small helper classes (dates, DAOs, repositories) have many tiny functions.
    thresholdInClasses: 16
    thresholdInInterfaces: 16
    thresholdInObjects: 16
    ignorePrivate: true
    ignoreAnnotatedFunctions: [ 'Preview' ]

style:
  ReturnCount:
    # Early 'return Failure' guard clauses are clear and common in use cases.
    max: 3
    excludeGuardClauses: true
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotated: [ 'Preview', 'Composable' ]
    excludes: [ '**/test/**', '**/androidTest/**', '**/ui/theme/**' ]
  UnusedPrivateMember:
    ignoreAnnotated: [ 'Preview' ]

Compose:
  ModifierMissing:
    active: true
